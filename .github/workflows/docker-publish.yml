name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repo name
        id: repo
        run: echo "repo_lower=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ steps.repo.outputs.repo_lower }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ steps.repo.outputs.repo_lower }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Check permissions
        run: |
          echo "Checking runner identity and permissions..."
          kubectl auth whoami
          kubectl auth can-i update deployments -n main

      - name: Inject Secrets as Env Vars
        env:
          # Add your FRONTEND_* secrets here (one per line)
          FRONTEND_TEST: ${{ secrets.FRONTEND_TEST }}
        run: |
          echo "Checking FRONTEND_* environment variables..."
          env | grep '^FRONTEND_' || echo "No FRONTEND_* variables found in environment"

          ENV_ARGS=""
          for var in $(env | grep '^FRONTEND_' | cut -d= -f1); do
            value="${!var}"
            if [ -z "$value" ]; then
              echo "WARNING: $var is empty or not set!"
            else
              echo "Found $var with value (length: ${#value} characters)"
            fi
            ENV_ARGS="$ENV_ARGS ${var}=${value}"
          done

          if [ -z "$ENV_ARGS" ]; then
            echo "ERROR: No FRONTEND_* secrets to inject"
            exit 1
          fi

          echo "Updating deployment with environment variables..."
          kubectl set env deployment/frontend -n main $ENV_ARGS

      - name: Rollout restart deployment
        run: |
          kubectl rollout restart deployment/frontend -n main

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/frontend -n main --timeout=5m
