name: PR Build Check

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Build status
        if: success()
        run: echo "Build completed successfully! PR can be merged."

      - name: Build failed
        if: failure()
        run: |
          echo "Build failed! Please fix the errors before merging."
          exit 1
